<svg xmlns="http://www.w3.org/2000/svg" width="800" height="620" viewBox="0 0 800 620" role="img" aria-labelledby="xs-title xs-desc">
  <title id="xs-title">A sketch of Xcode's Signing and Capabilities tab, with the four things to set</title>
  <desc id="xs-desc">A drawing of the Xcode window, not a screenshot. On the left, the Targets list holds App and PersonalOSWidgets. Label one: pick a target, and do everything for both. On the right, in the Signing and Capabilities tab, label two points at the Team menu, label three at the Bundle Identifier field, and label four at the App Groups box. Both targets need the same team and the same App Group.</desc>
  <style>
    .t { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #F2ECE4; }
    .m { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #F2ECE4; }
    .n { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #0B0A0D; }
    .dim { fill: #B5AEA6; }
    .win { fill: #17151B; stroke: #F2ECE4; stroke-width: 2; }
    .field { fill: #0B0A0D; stroke: #5A5460; stroke-width: 1.5; }
    .rule { stroke: #3A3540; stroke-width: 2; }
  </style>
  <rect width="800" height="620" fill="#0B0A0D"/>

  <text class="t" x="24" y="46" font-size="26" font-weight="600">Xcode: Signing &amp; Capabilities</text>
  <text class="t dim" x="24" y="74" font-size="16">A sketch, not a screenshot. Your Xcode may look a little different.</text>

  <!-- window -->
  <rect class="win" x="24" y="98" width="752" height="348"/>
  <!-- tab bar -->
  <rect x="25" y="99" width="750" height="40" fill="#26222C"/>
  <text class="t dim" x="250" y="125" font-size="15">General</text>
  <rect x="326" y="105" width="204" height="28" fill="#0B0A0D" stroke="#F2ECE4" stroke-width="1.5"/>
  <text class="t" x="338" y="125" font-size="15" font-weight="600">Signing &amp; Capabilities</text>
  <text class="t dim" x="548" y="125" font-size="15">Info</text>
  <text class="t dim" x="600" y="125" font-size="15">Build Settings</text>

  <!-- sidebar -->
  <line class="rule" x1="224" y1="139" x2="224" y2="446"/>
  <text class="t dim" x="40" y="170" font-size="14" font-weight="700">TARGETS</text>
  <rect x="36" y="182" width="176" height="34" fill="#F5D3A1"/>
  <text class="t" x="48" y="205" font-size="15" font-weight="700" style="fill:#0B0A0D">App</text>
  <rect x="36" y="222" width="176" height="34" fill="#26222C" stroke="#F5D3A1" stroke-width="2"/>
  <text class="t" x="48" y="245" font-size="15">PersonalOSWidgets</text>
  <rect x="182" y="148" width="30" height="30" fill="#F5D3A1"/>
  <text class="n" x="197" y="169" font-size="17" font-weight="700" text-anchor="middle">1</text>

  <!-- main -->
  <text class="t" x="244" y="172" font-size="16" font-weight="700">Signing</text>
  <rect x="384" y="188" width="18" height="18" fill="#F2ECE4"/>
  <path d="M388 197 L392 202 L399 192" fill="none" stroke="#0B0A0D" stroke-width="2.5"/>
  <text class="t" x="412" y="203" font-size="15">Automatically manage signing</text>

  <text class="t dim" x="372" y="243" font-size="15" text-anchor="end">Team</text>
  <rect x="384" y="222" width="300" height="32" fill="#0B0A0D" stroke="#F89A5B" stroke-width="3"/>
  <text class="t" x="396" y="243" font-size="15">Your Name (Personal Team)</text>
  <path d="M662 234 L668 242 L674 234" fill="none" stroke="#F2ECE4" stroke-width="2"/>
  <rect x="700" y="223" width="30" height="30" fill="#F89A5B"/>
  <text class="n" x="715" y="244" font-size="17" font-weight="700" text-anchor="middle">2</text>

  <text class="t dim" x="372" y="287" font-size="15" text-anchor="end">Bundle Identifier</text>
  <rect x="384" y="266" width="300" height="32" fill="#0B0A0D" stroke="#F4664F" stroke-width="3"/>
  <text class="m" x="396" y="287" font-size="15">com.example.awqat</text>
  <rect x="700" y="267" width="30" height="30" fill="#F4664F"/>
  <text class="n" x="715" y="288" font-size="17" font-weight="700" text-anchor="middle">3</text>

  <line class="rule" x1="244" y1="318" x2="756" y2="318"/>
  <text class="t" x="244" y="348" font-size="16" font-weight="700">App Groups</text>
  <rect x="384" y="362" width="300" height="36" fill="#0B0A0D" stroke="#EF3A78" stroke-width="3"/>
  <rect x="394" y="371" width="18" height="18" fill="#F2ECE4"/>
  <path d="M398 380 L402 385 L409 375" fill="none" stroke="#0B0A0D" stroke-width="2.5"/>
  <text class="m" x="422" y="385" font-size="15">group.com.example.awqat</text>
  <rect x="700" y="365" width="30" height="30" fill="#EF3A78"/>
  <text class="n" x="715" y="386" font-size="17" font-weight="700" text-anchor="middle">4</text>

  <text class="t dim" x="244" y="428" font-size="15">HealthKit (on the App target only)</text>

  <!-- legend -->
  <rect x="24" y="468" width="30" height="30" fill="#F5D3A1"/>
  <text class="n" x="39" y="489" font-size="17" font-weight="700" text-anchor="middle">1</text>
  <text class="t" x="66" y="489" font-size="16">Pick a target. Do 2, 3 and 4 for App, then again for PersonalOSWidgets.</text>

  <rect x="24" y="506" width="30" height="30" fill="#F89A5B"/>
  <text class="n" x="39" y="527" font-size="17" font-weight="700" text-anchor="middle">2</text>
  <text class="t" x="66" y="527" font-size="16">Team: choose your own. It must be the same on both targets.</text>

  <rect x="24" y="544" width="30" height="30" fill="#F4664F"/>
  <text class="n" x="39" y="565" font-size="17" font-weight="700" text-anchor="middle">3</text>
  <text class="t" x="66" y="565" font-size="16">Bundle Identifier: your own. The widgets' one ends in .widgets.</text>

  <rect x="24" y="582" width="30" height="30" fill="#EF3A78"/>
  <text class="n" x="39" y="603" font-size="17" font-weight="700" text-anchor="middle">4</text>
  <text class="t" x="66" y="603" font-size="16">App Groups: one group, ticked on both targets, spelled the same.</text>
</svg>
