<svg xmlns="http://www.w3.org/2000/svg" width="800" height="640" viewBox="0 0 800 640" role="img" aria-labelledby="mt-title mt-desc">
  <title id="mt-title">What the make it yours command changes</title>
  <desc id="mt-desc">One command changes four parts of the tree. The settings: capacitor.config.ts and index.html. Android: build.gradle, proguard-rules.pro, strings.xml, shortcuts.xml, and the Java folder, which moves to match the new id. iOS: project.pbxproj for both targets, both Info.plist files, both entitlements files, SharedStore.swift and the words in the Swift files. The web app: coverFiles.ts, the words on screen in src, and the tests. It leaves alone the docs, the licence and notices, comments, the icon, the colours and the privacy page.</desc>
  <style>
    .t { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #F2ECE4; }
    .m { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #F5D3A1; }
    .n { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #0B0A0D; }
    .dim { fill: #B5AEA6; }
    .box { fill: #17151B; stroke: #3A3540; stroke-width: 2; }
    .line { fill: none; stroke: #B5AEA6; stroke-width: 2; }
  </style>
  <defs>
    <marker id="mt-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#B5AEA6"/>
    </marker>
  </defs>
  <rect width="800" height="640" fill="#0B0A0D"/>

  <text class="t" x="24" y="46" font-size="26" font-weight="600">One command, four parts of the tree</text>
  <text class="t dim" x="24" y="74" font-size="16">Every place the app id and the name are written, changed together.</text>

  <rect x="24" y="96" width="752" height="50" fill="#17151B" stroke="#EF3A78" stroke-width="2"/>
  <text class="m" x="40" y="127" font-size="15">node scripts/make-it-yours.mjs --id com.example.myapp --name "My App"</text>

  <path class="line" d="M212 146 V170" marker-end="url(#mt-arrow)"/>
  <path class="line" d="M588 146 V170" marker-end="url(#mt-arrow)"/>

  <!-- Settings -->
  <rect class="box" x="24" y="174" width="368" height="128"/>
  <rect x="40" y="190" width="28" height="28" fill="#F5D3A1"/>
  <text class="n" x="54" y="210" font-size="16" font-weight="700" text-anchor="middle">1</text>
  <text class="t" x="80" y="211" font-size="18" font-weight="600">Settings</text>
  <text class="m" x="40" y="246" font-size="14">capacitor.config.ts</text>
  <text class="t dim" x="228" y="246" font-size="14">id and name</text>
  <text class="m" x="40" y="272" font-size="14">index.html</text>
  <text class="t dim" x="228" y="272" font-size="14">the page title</text>

  <!-- Web app -->
  <rect class="box" x="408" y="174" width="368" height="128"/>
  <rect x="424" y="190" width="28" height="28" fill="#F89A5B"/>
  <text class="n" x="438" y="210" font-size="16" font-weight="700" text-anchor="middle">2</text>
  <text class="t" x="464" y="211" font-size="18" font-weight="600">The web app</text>
  <text class="m" x="424" y="246" font-size="14">src/books/coverFiles.ts</text>
  <text class="t dim" x="640" y="246" font-size="14">OWN_FOLDER</text>
  <text class="m" x="424" y="272" font-size="14">src/ and test/</text>
  <text class="t dim" x="640" y="272" font-size="14">words on screen</text>

  <!-- Android -->
  <rect class="box" x="24" y="318" width="368" height="206"/>
  <rect x="40" y="334" width="28" height="28" fill="#F4664F"/>
  <text class="n" x="54" y="354" font-size="16" font-weight="700" text-anchor="middle">3</text>
  <text class="t" x="80" y="355" font-size="18" font-weight="600">Android</text>
  <text class="m" x="40" y="390" font-size="14">build.gradle</text>
  <text class="t dim" x="228" y="390" font-size="14">namespace and id</text>
  <text class="m" x="40" y="416" font-size="14">proguard-rules.pro</text>
  <text class="t dim" x="228" y="416" font-size="14">keep rules</text>
  <text class="m" x="40" y="442" font-size="14">strings.xml</text>
  <text class="t dim" x="228" y="442" font-size="14">name and labels</text>
  <text class="m" x="40" y="468" font-size="14">shortcuts.xml</text>
  <text class="t dim" x="228" y="468" font-size="14">long-press targets</text>
  <text class="m" x="40" y="494" font-size="14">java/app/awqat/</text>
  <text class="t" x="228" y="494" font-size="14" style="fill:#EF3A78">the folder moves</text>

  <!-- iOS -->
  <rect class="box" x="408" y="318" width="368" height="206"/>
  <rect x="424" y="334" width="28" height="28" fill="#EF3A78"/>
  <text class="n" x="438" y="354" font-size="16" font-weight="700" text-anchor="middle">4</text>
  <text class="t" x="464" y="355" font-size="18" font-weight="600">iPhone and iPad</text>
  <text class="m" x="424" y="390" font-size="14">project.pbxproj</text>
  <text class="t dim" x="620" y="390" font-size="14">both bundle ids</text>
  <text class="m" x="424" y="416" font-size="14">Info.plist, twice</text>
  <text class="t dim" x="620" y="416" font-size="14">the name</text>
  <text class="m" x="424" y="442" font-size="14">*.entitlements, twice</text>
  <text class="t dim" x="620" y="442" font-size="14">the App Group</text>
  <text class="m" x="424" y="468" font-size="14">SharedStore.swift</text>
  <text class="t dim" x="620" y="468" font-size="14">the App Group</text>
  <text class="m" x="424" y="494" font-size="14">*.swift</text>
  <text class="t dim" x="620" y="494" font-size="14">Siri and widgets</text>

  <!-- Left alone -->
  <rect x="24" y="546" width="8" height="70" fill="#9B3FA0"/>
  <text class="t" x="46" y="566" font-size="16" font-weight="600">Left alone, on purpose</text>
  <text class="t dim" x="46" y="590" font-size="15">Docs, LICENSE, THIRD_PARTY_NOTICES, credits and code comments.</text>
  <text class="t dim" x="46" y="612" font-size="15">The icon, the colours and the privacy page: those are yours to do by hand.</text>
</svg>
