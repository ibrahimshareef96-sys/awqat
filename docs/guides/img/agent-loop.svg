<svg xmlns="http://www.w3.org/2000/svg" width="800" height="380" viewBox="0 0 800 380" role="img" aria-labelledby="al-title al-desc">
  <title id="al-title">The loop when you work with a coding agent</title>
  <desc id="al-desc">Five boxes in a row. One, you paste a prompt. Two, the agent reads AGENTS.md. Three, the agent edits the files. Four, the agent runs the checks: typecheck, tests and build. Five, you look before you keep the change. An arrow runs back from five to one: if it is not right, say what is wrong and go again.</desc>
  <style>
    .t { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #F2ECE4; }
    .n { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #0B0A0D; }
    .dim { fill: #B5AEA6; }
    .box { fill: #17151B; stroke: #3A3540; stroke-width: 2; }
    .line { fill: none; stroke: #B5AEA6; stroke-width: 2; }
  </style>
  <defs>
    <marker id="al-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#B5AEA6"/>
    </marker>
  </defs>
  <rect width="800" height="380" fill="#0B0A0D"/>

  <text class="t" x="24" y="46" font-size="26" font-weight="600">You, the agent, and the checks</text>
  <text class="t dim" x="24" y="74" font-size="16">Sand is you. Coral is the agent. You always get the last look.</text>

  <rect x="24" y="98" width="136" height="150" fill="#17151B" stroke="#F5D3A1" stroke-width="2"/>
  <rect x="38" y="112" width="32" height="32" fill="#F5D3A1"/>
  <text class="n" x="54" y="134" font-size="17" font-weight="700" text-anchor="middle">1</text>
  <text class="t" x="38" y="176" font-size="17" font-weight="600">You paste</text>
  <text class="t" x="38" y="198" font-size="17" font-weight="600">a prompt</text>
  <text class="t dim" x="38" y="228" font-size="14">plain English</text>

  <rect class="box" x="178" y="98" width="136" height="150"/>
  <rect x="192" y="112" width="32" height="32" fill="#F4664F"/>
  <text class="n" x="208" y="134" font-size="17" font-weight="700" text-anchor="middle">2</text>
  <text class="t" x="192" y="176" font-size="17" font-weight="600">It reads</text>
  <text class="t" x="192" y="198" font-size="17" font-weight="600">AGENTS.md</text>
  <text class="t dim" x="192" y="228" font-size="14">the six rules</text>

  <rect class="box" x="332" y="98" width="136" height="150"/>
  <rect x="346" y="112" width="32" height="32" fill="#F4664F"/>
  <text class="n" x="362" y="134" font-size="17" font-weight="700" text-anchor="middle">3</text>
  <text class="t" x="346" y="176" font-size="17" font-weight="600">It edits</text>
  <text class="t" x="346" y="198" font-size="17" font-weight="600">the files</text>
  <text class="t dim" x="346" y="228" font-size="14">with new tests</text>

  <rect class="box" x="486" y="98" width="136" height="150"/>
  <rect x="500" y="112" width="32" height="32" fill="#F4664F"/>
  <text class="n" x="516" y="134" font-size="17" font-weight="700" text-anchor="middle">4</text>
  <text class="t" x="500" y="176" font-size="17" font-weight="600">It runs</text>
  <text class="t" x="500" y="198" font-size="17" font-weight="600">the checks</text>
  <text class="t dim" x="500" y="228" font-size="14">types, tests, build</text>

  <rect x="640" y="98" width="136" height="150" fill="#17151B" stroke="#F5D3A1" stroke-width="2"/>
  <rect x="654" y="112" width="32" height="32" fill="#F5D3A1"/>
  <text class="n" x="670" y="134" font-size="17" font-weight="700" text-anchor="middle">5</text>
  <text class="t" x="654" y="176" font-size="17" font-weight="600">You look</text>
  <text class="t" x="654" y="198" font-size="17" font-weight="600">before you</text>
  <text class="t" x="654" y="220" font-size="17" font-weight="600">keep it</text>

  <path class="line" d="M160 173 H174" marker-end="url(#al-arrow)"/>
  <path class="line" d="M314 173 H328" marker-end="url(#al-arrow)"/>
  <path class="line" d="M468 173 H482" marker-end="url(#al-arrow)"/>
  <path class="line" d="M622 173 H636" marker-end="url(#al-arrow)"/>

  <path class="line" d="M708 248 V300 H92 V254" marker-end="url(#al-arrow)"/>
  <rect x="236" y="284" width="328" height="32" fill="#0B0A0D"/>
  <text class="t dim" x="400" y="306" font-size="15" text-anchor="middle">Not right? Say what is wrong and go again.</text>

  <text class="t dim" x="24" y="354" font-size="15">The agent can be wrong. Step 5 is yours every time.</text>
</svg>
