<svg xmlns="http://www.w3.org/2000/svg" width="800" height="700" viewBox="0 0 800 700" role="img" aria-labelledby="mp-title mp-desc">
  <title id="mp-title">The path from your copy to the stores</title>
  <desc id="mp-desc">Seven stops, top to bottom. One, your id and name, with the make it yours command. Two, your look: the icon, the splash screen, the colours and the skies. Three, your privacy page, public/privacypolicy.html, and the two iOS privacy manifests. Four, what you owe others: keep LICENSE and THIRD_PARTY_NOTICES, and follow Quran Foundation's developer terms. Five, your signature: your Apple team on both targets and your own Android keystore. Six, test on a real phone. Seven, send it to the stores.</desc>
  <style>
    .t { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #F2ECE4; }
    .m { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #F5D3A1; }
    .n { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #0B0A0D; }
    .dim { fill: #B5AEA6; }
    .box { fill: #17151B; stroke: #3A3540; stroke-width: 2; }
    .line { fill: none; stroke: #B5AEA6; stroke-width: 2; }
  </style>
  <rect width="800" height="700" fill="#0B0A0D"/>

  <text class="t" x="24" y="46" font-size="26" font-weight="600">From your copy to the stores</text>
  <text class="t dim" x="24" y="74" font-size="16">Seven stops. Do them in order and tick each one off.</text>

  <!-- the path -->
  <path class="line" d="M62 128 V634"/>

  <rect x="46" y="100" width="32" height="32" fill="#F5D3A1"/>
  <text class="n" x="62" y="122" font-size="17" font-weight="700" text-anchor="middle">1</text>
  <rect class="box" x="100" y="94" width="676" height="64"/>
  <text class="t" x="116" y="120" font-size="18" font-weight="600">Your id and name</text>
  <text class="m" x="116" y="144" font-size="14">node scripts/make-it-yours.mjs --id ... --name ...</text>

  <rect x="46" y="182" width="32" height="32" fill="#F7B77E"/>
  <text class="n" x="62" y="204" font-size="17" font-weight="700" text-anchor="middle">2</text>
  <rect class="box" x="100" y="176" width="676" height="64"/>
  <text class="t" x="116" y="202" font-size="18" font-weight="600">Your look</text>
  <text class="t dim" x="116" y="226" font-size="15">The icon and splash screen, the colours, the six sky paintings.</text>

  <rect x="46" y="264" width="32" height="32" fill="#F89A5B"/>
  <text class="n" x="62" y="286" font-size="17" font-weight="700" text-anchor="middle">3</text>
  <rect class="box" x="100" y="258" width="676" height="64"/>
  <text class="t" x="116" y="284" font-size="18" font-weight="600">Your privacy page</text>
  <text class="m" x="116" y="308" font-size="14">public/privacypolicy.html</text>
  <text class="t dim" x="350" y="308" font-size="15">and the two PrivacyInfo.xcprivacy files</text>

  <rect x="46" y="346" width="32" height="32" fill="#F4664F"/>
  <text class="n" x="62" y="368" font-size="17" font-weight="700" text-anchor="middle">4</text>
  <rect class="box" x="100" y="340" width="676" height="64"/>
  <text class="t" x="116" y="366" font-size="18" font-weight="600">What you owe others</text>
  <text class="t dim" x="116" y="390" font-size="15">Keep LICENSE and THIRD_PARTY_NOTICES. Follow Quran Foundation's terms.</text>

  <rect x="46" y="428" width="32" height="32" fill="#EF3A78"/>
  <text class="n" x="62" y="450" font-size="17" font-weight="700" text-anchor="middle">5</text>
  <rect class="box" x="100" y="422" width="676" height="64"/>
  <text class="t" x="116" y="448" font-size="18" font-weight="600">Your signature</text>
  <text class="t dim" x="116" y="472" font-size="15">Your Apple team on both targets. Your own Android keystore, never committed.</text>

  <rect x="46" y="510" width="32" height="32" fill="#C63D8C"/>
  <text class="n" x="62" y="532" font-size="17" font-weight="700" text-anchor="middle">6</text>
  <rect class="box" x="100" y="504" width="676" height="64"/>
  <text class="t" x="116" y="530" font-size="18" font-weight="600">Test on a real phone</text>
  <text class="t dim" x="116" y="554" font-size="15">Widgets, the icon's long-press shortcuts, a book cover photo, a reminder.</text>

  <rect x="46" y="592" width="32" height="32" fill="#9B3FA0"/>
  <text class="t" x="62" y="614" font-size="17" font-weight="700" text-anchor="middle">7</text>
  <rect x="100" y="586" width="676" height="64" fill="#17151B" stroke="#EF3A78" stroke-width="2"/>
  <text class="t" x="116" y="612" font-size="18" font-weight="600">Send it to the stores</text>
  <text class="t dim" x="116" y="636" font-size="15">Google Play takes a signed bundle. App Store Connect takes an archive from Xcode.</text>

  <text class="t dim" x="24" y="680" font-size="14">Each stop has its own section in guide 04.</text>
</svg>
