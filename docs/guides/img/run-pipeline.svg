<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400" role="img" aria-labelledby="rp-title rp-desc">
  <title id="rp-title">From nothing to Awqat in your browser, in six steps</title>
  <desc id="rp-desc">Six boxes in order. One, install Node 22 and check with node -v. Two, get the code with git clone. Three, install with npm ci. Four, test with npm test. Five, build with npm run build, which makes the dist folder. Six, preview with npx vite preview, which serves the app at localhost port 4173.</desc>
  <style>
    .t { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #F2ECE4; }
    .m { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #F5D3A1; }
    .n { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #0B0A0D; }
    .dim { fill: #B5AEA6; }
    .box { fill: #17151B; stroke: #3A3540; stroke-width: 2; }
    .line { fill: none; stroke: #B5AEA6; stroke-width: 2; }
  </style>
  <defs>
    <marker id="rp-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#B5AEA6"/>
    </marker>
  </defs>
  <rect width="800" height="400" fill="#0B0A0D"/>

  <text class="t" x="24" y="46" font-size="26" font-weight="600">From zero to the browser</text>
  <text class="t dim" x="24" y="74" font-size="16">Each box is one command. The last line is what you should see.</text>

  <!-- row 1 -->
  <rect class="box" x="24" y="98" width="236" height="120"/>
  <rect x="40" y="114" width="32" height="32" fill="#F5D3A1"/>
  <text class="n" x="56" y="136" font-size="17" font-weight="700" text-anchor="middle">1</text>
  <text class="t" x="84" y="137" font-size="18" font-weight="600">Install Node 22</text>
  <text class="m" x="40" y="176" font-size="16">node -v</text>
  <text class="t dim" x="40" y="202" font-size="15">See: v22 or higher</text>

  <rect class="box" x="282" y="98" width="236" height="120"/>
  <rect x="298" y="114" width="32" height="32" fill="#F5D3A1"/>
  <text class="n" x="314" y="136" font-size="17" font-weight="700" text-anchor="middle">2</text>
  <text class="t" x="342" y="137" font-size="18" font-weight="600">Get the code</text>
  <text class="m" x="298" y="176" font-size="16">git clone</text>
  <text class="t dim" x="298" y="202" font-size="15">See: a folder named awqat</text>

  <rect class="box" x="540" y="98" width="236" height="120"/>
  <rect x="556" y="114" width="32" height="32" fill="#F89A5B"/>
  <text class="n" x="572" y="136" font-size="17" font-weight="700" text-anchor="middle">3</text>
  <text class="t" x="600" y="137" font-size="18" font-weight="600">Install the parts</text>
  <text class="m" x="556" y="176" font-size="16">npm ci</text>
  <text class="t dim" x="556" y="202" font-size="15">See: added packages</text>

  <path class="line" d="M260 158 H278" marker-end="url(#rp-arrow)"/>
  <path class="line" d="M518 158 H536" marker-end="url(#rp-arrow)"/>
  <path class="line" d="M658 218 V238 H142 V254" marker-end="url(#rp-arrow)"/>

  <!-- row 2 -->
  <rect class="box" x="24" y="258" width="236" height="120"/>
  <rect x="40" y="274" width="32" height="32" fill="#F89A5B"/>
  <text class="n" x="56" y="296" font-size="17" font-weight="700" text-anchor="middle">4</text>
  <text class="t" x="84" y="297" font-size="18" font-weight="600">Run the tests</text>
  <text class="m" x="40" y="336" font-size="16">npm test</text>
  <text class="t dim" x="40" y="362" font-size="15">See: every test passed</text>

  <rect class="box" x="282" y="258" width="236" height="120"/>
  <rect x="298" y="274" width="32" height="32" fill="#F4664F"/>
  <text class="n" x="314" y="296" font-size="17" font-weight="700" text-anchor="middle">5</text>
  <text class="t" x="342" y="297" font-size="18" font-weight="600">Build it</text>
  <text class="m" x="298" y="336" font-size="16">npm run build</text>
  <text class="t dim" x="298" y="362" font-size="15">See: a new dist/ folder</text>

  <rect x="540" y="258" width="236" height="120" fill="#17151B" stroke="#EF3A78" stroke-width="2"/>
  <rect x="556" y="274" width="32" height="32" fill="#EF3A78"/>
  <text class="n" x="572" y="296" font-size="17" font-weight="700" text-anchor="middle">6</text>
  <text class="t" x="600" y="297" font-size="18" font-weight="600">Open it</text>
  <text class="m" x="556" y="336" font-size="16">npx vite preview</text>
  <text class="t dim" x="556" y="362" font-size="15">See: localhost:4173</text>

  <path class="line" d="M260 318 H278" marker-end="url(#rp-arrow)"/>
  <path class="line" d="M518 318 H536" marker-end="url(#rp-arrow)"/>
</svg>
